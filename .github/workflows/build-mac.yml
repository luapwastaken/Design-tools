name: Build macOS app

# Build the macOS .dmg on a macOS runner (can't be done from Windows).
# Trigger it manually from the Actions tab, or by pushing a version tag like v1.8.0.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build .dmg (unsigned)
        env:
          # Don't try to code-sign / notarize — no Apple Developer account needed.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesignTools-macOS
          path: dist-electron/*.dmg
          if-no-files-found: error

      # On a version tag, also attach the .dmg to a GitHub Release.
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-electron/*.dmg
