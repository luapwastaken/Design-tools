name: Build apps

# Builds the macOS .dmg and Windows .exe.
# Trigger manually from the Actions tab, or by pushing a version tag like v1.8.0.
# On a tag, both artifacts are attached to a single GitHub Release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: DesignTools-macOS
            glob: dist-electron/*.dmg
          - os: windows-latest
            artifact: DesignTools-Windows
            glob: dist-electron/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Don't try to code-sign / notarize — no Apple Developer account needed.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        # --publish never: we attach to the Release ourselves (next step),
        # so electron-builder must not try to publish (which needs GH_TOKEN).
        run: npm run build && npx electron-builder --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

      # On a version tag, attach the build to a GitHub Release.
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.glob }}
